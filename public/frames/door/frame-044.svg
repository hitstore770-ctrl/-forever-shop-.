<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2ece1"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ded0"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f2ea"/>
      <stop offset="0.5" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#efe9de"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a4a88"/>
      <stop offset="1" stop-color="#12325c"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.55" r="0.65">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.55" stop-color="#e5b842"/>
      <stop offset="1" stop-color="#9a7318"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1800" fill="url(#sky)"/>

  <g transform="translate(600,1010) scale(1.5) translate(-600,-1010)">
    <rect x="-400" y="1160" width="2000" height="1200" fill="url(#floor)"/>
    <rect x="-400" y="-400" width="2000" height="1560" fill="url(#wall)"/>
    <line x1="-400" y1="1160" x2="1600" y2="1160" stroke="#12325c" stroke-opacity="0.1" stroke-width="3"/>

    <!-- doorway interior: dark until the light behind it comes up -->
    <rect x="490" y="690" width="220" height="470" fill="#0d2547"/>
    <rect x="490" y="690" width="220" height="470" fill="url(#warm)" opacity="1"/>

    <!-- light spilling across the floor once the door is ajar -->
    <polygon points="490,1160 710,1160 920,1800 280,1800" fill="#e5b842" opacity="0.4"/>

    <polygon points="490,690 490,736 490,1114 490,1160" fill="url(#panel)"/>
    <polygon points="490,690 490,736 490,1114 490,1160" fill="none" stroke="#e5b842" stroke-opacity="0.8" stroke-width="4"/>

    <rect x="474" y="674" width="252" height="486" fill="none" stroke="#12325c" stroke-opacity="0.16" stroke-width="6"/>
  </g>

  <rect width="1200" height="1800" fill="#fdfcfa" opacity="0.4"/>
</svg>
